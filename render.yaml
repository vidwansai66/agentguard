services:
  - type: web
    name: agentguard-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AGENTGUARD_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://agentguard-chi.vercel.app,http://localhost:5173
